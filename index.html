<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量去水印工具</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body data-theme="macaron">

<div id="progress-wrap"><div id="progress-bar"></div></div>

<header>
    <h1>批量去水印工具</h1>
    
    <div class="theme-panel">
        <div class="theme-btn" id="currentThemeIcon"></div>
        <div class="theme-options-wrap">
            <div class="color-dot dot-macaron active" data-theme="macaron"></div>
            <div class="color-dot dot-deepblue" data-theme="deepBlue"></div>
        </div>
    </div>
</header>

<div class="container">
    <div id="dropzone">
        <p>🚀 拖拽图片到这里，或者 <strong>点击浏览文件</strong></p>
        <p class="sub-text">本地异步处理 • 无需上传服务器</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none">
    </div>

    <div id="gallery"></div>
</div>

<div class="action-bar">
    <button class="btn-main" id="btnRepair">开始修复</button>
    <div class="export-options">
        <label><input type="checkbox" id="checkZip" checked> ZIP</label>
        <label><input type="checkbox" id="checkPdf"> PDF</label>
    </div>
    <button class="btn-main" id="btnExport" style="background: var(--text-main);">立即导出</button>
</div>

<div id="toast"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/repairEngine.js"></script>
<script src="assets/js/watermarkAnnotator.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
